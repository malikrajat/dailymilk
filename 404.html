<html lang="en" data-beasties-container="">
  <head><meta http-equiv="Content-Security-Policy" content="script-src 'strict-dynamic' 'sha256-5CpYvcfJ1wA+5xfHoPmUU0oSfutGolJnQ8C5h9FNAjw=' 'sha256-022kjnIHY+yv5ocx/+1pWvg4y2gdQazfGpVw8D1mXlE=' 'sha256-LMY6wYoFV9I4wWzxaq1N/dTpl4iurQktw706UCHK3vM=' https: 'unsafe-inline';object-src 'none';base-uri 'self';">
    <meta charset="utf-8">
    <title>Dairy Hub — Milk Deliveries</title>
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#3b82f6">
    <meta name="description" content="Dairy Hub — track daily milk purchases, rates, payments and reports for your delivery business.">
    <!--
      The exact product name, in the static HTML head. The home page is a
      client-rendered SPA, so a name that exists only inside the Angular bundle
      is invisible to any checker that does not run JavaScript. This keeps the
      name in the served markup alongside the <title>.
    -->
    <meta name="application-name" content="Dairy Hub">

    <!--
      Machine-readable identity. The static head is the only thing a crawler
      that does not run JavaScript sees, so the canonical URL, the crawler
      permission, the social card and the structured data all live here rather
      than inside the Angular bundle.

      The canonical URL is also updated by `SeoTitleStrategy` as the router
      changes pages, which is what keeps a client-side navigation from
      canonicalising every screen to "/". The value here is the fallback for a
      non-JS fetch.
    -->
    <meta name="author" content="Rajat Malik">
    <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">
    <link rel="canonical" href="https://dailymilk.netlify.app/">
    <link rel="alternate" type="text/plain" href="/llms.txt" title="Dairy Hub for AI assistants">

    <!-- Open Graph: used by social cards and by most link unfurlers. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Dairy Hub">
    <meta property="og:title" content="Dairy Hub — Milk Deliveries">
    <meta property="og:description" content="Dairy Hub — track daily milk purchases, rates, payments and reports for your delivery business.">
    <meta property="og:url" content="https://dailymilk.netlify.app/">
    <meta property="og:image" content="https://dailymilk.netlify.app/icons/icon-512x512.png">
    <meta property="og:image:alt" content="Dairy Hub app icon">
    <meta property="og:image:width" content="512">
    <meta property="og:image:height" content="512">
    <meta property="og:locale" content="en_US">

    <!-- Twitter/X. `summary` keeps the square icon uncropped. -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Dairy Hub — Milk Deliveries">
    <meta name="twitter:description" content="Dairy Hub — track daily milk purchases, rates, payments and reports for your delivery business.">
    <meta name="twitter:image" content="https://dailymilk.netlify.app/icons/icon-512x512.png">

    <!--
      Structured data for search engines and answer engines. `price: "0"` is the
      literal truth: the app is free, with no paid tier and no billing details.

      The production build's autoCsp hashes every inline script in this file,
      this one included, so the JSON-LD is allowed by the strict policy as well
      as by the resource policy below.
    -->

        "@type": "SoftwareApplication",

        "applicationSubCategory": "Milk delivery records and reporting",
        "operatingSystem": "Any modern web browser; installable on Android, iOS, Windows, macOS and Linux",
        "url": "https://dailymilk.netlify.app/",

        "inLanguage": "en",

    <!--
      The web app manifest. Together with the service worker and the 192px and
      512px icons below, this is what makes the browser offer to install the app:
      Chromium shows an install icon in the address bar (or an "Install" entry in
      the menu) once the manifest, an icon of at least 192px, HTTPS and a
      service worker with a fetch handler are all present.

      `start_url` is "/" rather than the page the user happened to be on. That
      matters more than it looks: installing from a "/privacy" or "/contact" tab
      would otherwise create a home-screen shortcut that opens onto a public
      marketing page instead of into the app.
    -->
    <link rel="manifest" href="manifest.webmanifest">

    <!--
      Installed-app behaviour on iOS. iOS ignores `display` in the manifest and
      reads these instead, and it ignores the manifest icons in favour of
      apple-touch-icon - which is why that link points at opaque PNGs and not at
      favicon.svg, as it used to. iOS does not support SVG for a home-screen
      icon and silently falls back to a screenshot of the page.
    -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Dairy Hub">

    <!--
      Branded icons. The SVG is listed first so modern browsers use the crisp
      scalable mark; the PNGs cover browsers that will not use an SVG favicon,
      and the .ico answers the implicit /favicon.ico request. This also fixes the
      previous markup, which advertised the SVG under an `image/x-icon` type.
    -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
    <link rel="alternate icon" type="image/x-icon" href="favicon.ico">
    <link rel="mask-icon" href="favicon.svg" color="#3b82f6">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180x180.png">
    <link rel="apple-touch-icon" sizes="167x167" href="icons/apple-touch-icon-167x167.png">
    <link rel="apple-touch-icon" sizes="152x152" href="icons/apple-touch-icon-152x152.png">

    <!--
      The app itself is JavaScript-only. Without scripting the boot animation
      would sit on "Loading Dairy Hub…" forever, so it is hidden and the static
      summary in <body> is shown instead. This block is never parsed by a
      JavaScript-enabled browser.

    <noscript>
      <style>
        .dairy-boot {
          display: none !important;
        }
        .dairy-no-script {
          max-width: 42rem;
          margin: 0 auto;
          padding: 3rem 1.25rem;
          color: #334155;
          font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
          line-height: 1.7;

          line-height: 1.2;
          color: #0f172a;
        }
        .dairy-no-script a {
          color: #2563eb;
        }
      </style>
    </noscript>

      hash-based policy that the production build emits on its own
      (`security.autoCsp` in angular.json).

      A browser enforces *every* delivered policy, so the intersection of the
      two is what actually applies:

        * the auto-generated policy owns `script-src` (`'strict-dynamic'` plus
          the hashes of Angular's build-time bootstrap loader). That is what
          keeps production safe against injected inline scripts;

      way a static, server-less deployment can allow the inline bootstrap loader

      intersection stays strict. It also keeps `ng serve` working, where
      `autoCsp` is not applied and this is the only policy.

        * script-src  https://apis.google.com      (the gapi loader script)
        * frame-src   https://<authDomain>         (/__/auth/iframe)

  <body>
    <!--
      What a visitor, crawler or AI agent sees when JavaScript is unavailable.
      The app screens cannot work without scripting, so this is a real summary
      with links to the static pages rather than an empty shell.
    -->
    <noscript>
      <main class="dairy-no-script">
        <h1>Dairy Hub — Milk Deliveries</h1>
        <p>
          Dairy Hub is a free app for milk delivery businesses to record milkmen,
          daily milk entries, rates and payments, and to export reports as CSV or
          PDF. It can optionally back the database up to the user's own Google
          Drive. The app itself needs JavaScript and a free account.
        </p>
        <p>These pages work without JavaScript:</p>
        <ul>
          <li><a href="/about.html">About Dairy Hub</a></li>
          <li><a href="/privacy.html">Privacy Policy</a></li>
          <li><a href="/terms.html">Terms of Service</a></li>
          <li><a href="/llms.txt">Dairy Hub for AI assistants (llms.txt)</a></li>
        </ul>
        <p>
          Contact:
          <a href="mailto:contact@rajatmalik.dev">contact@rajatmalik.dev</a>
        </p>
      </main>
    </noscript>

    <!--
      Angular's built-in CSP nonce mechanism hooks into the ngCspNonce attribute.

      Everything inside <app-root> is a cold-start placeholder, not content:
      Angular replaces it wholesale when it bootstraps. Bootstrap waits for
      Firebase to report its stored session (see `app.config.ts`), so on a slow
      phone there is a real, visible gap between the HTML arriving and the app
      painting - long enough that a bare "Loading…" reads as a hung page.

      The animation is deliberately *self-contained*: one inline <style>, one
      inline <svg>, no external file, no script, no font, and no network
      request of any kind. It is the first thing on screen, so anything it
      waited for would delay the only thing the user is looking at. It is also
      why the styles live inside <app-root> rather than in the global
      stylesheet - they are gone the moment Angular wipes this subtree, and
      nothing has to remember to unload them.

      Inline CSS is permitted by the policy in <head> (`style-src 'self'
      'unsafe-inline'`), and no script is added, so the build's hash-based
      autoCsp still has nothing new to allow.

      The scene borrows the home-screen icon: the same blue-to-indigo tile,
      with the app's milk bottle tipping into a pan. The pot fills once and
      settles; the pour, the droplets and the caption keep moving, so nothing
      looks frozen if the boot takes a while.
    -->
    <app-root ngcspnonce="CSP_NONCE_PLACEHOLDER">
      <style nonce="CSP_NONCE_PLACEHOLDER">
        /*
         * Scoped to `.dairy-boot`, and keyframes are prefixed, so nothing here
         * can collide with the application's own stylesheet if the two are ever
         * on screen together.
         */
        .dairy-boot {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 20px;
          padding: 24px;
          box-sizing: border-box;
          background-color: #f8fafc;
          font-family:
            'Inter', 'Inter var', ui-sans-serif, system-ui, -apple-system,
            'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
          -webkit-font-smoothing: antialiased;
          -moz-osx-font-smoothing: grayscale;
        }

        .dairy-boot__art {
          display: block;
          width: clamp(108px, 36vw, 152px);
          height: auto;
          /* Lifts the tile off the pale canvas without a raster asset. */
          filter: drop-shadow(0 14px 26px rgba(59, 130, 246, 0.28));
        }

        .dairy-boot__label {
          margin: 0;
          font-size: 15px;
          font-weight: 500;
          line-height: 1.4;
          letter-spacing: 0.01em;
          color: #475569;
          animation: dairyBootPulse 1.8s ease-in-out infinite;
        }

        .dairy-boot__label strong {
          font-weight: 700;
          color: #3b82f6;
        }

        /*
         * The pour. A dashed stroke whose offset travels reads as liquid moving
         * through a fixed shape - no path morphing, so it stays cheap on a
         * phone that is already busy booting.
         */
        .dairy-boot__stream {
          stroke-dasharray: 15 11;
          animation: dairyBootPour 0.7s linear infinite;
        }

        /*
         * The level rises once and holds. It is clipped to the pan's interior,
         * so it can never spill over the rim however the level is animated, and
         * a single pass means there is no empty-then-full pop on repeat - the
         * pour and the caption carry the loop instead.
         *
         * It stops short of the rim on purpose: a pan filled flush to the top
         * is a solid white shape, and the point of the illustration is that it
         * is milk *in* a pan. The gap keeps the rim and the milk's surface
         * visible as separate lines.
         */
        .dairy-boot__milk {
          transform: translateY(50px);
          animation: dairyBootFill 2.1s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .dairy-boot__drop {
          opacity: 0;
          animation: dairyBootDrop 2.2s ease-in infinite;
        }

        .dairy-boot__drop--b {
          animation-delay: 0.7s;
        }

        @keyframes dairyBootPour {
          to {
            stroke-dashoffset: -26;
          }
        }

        @keyframes dairyBootFill {
          from {
            transform: translateY(50px);
          }
          to {
            transform: translateY(12px);
          }
        }

        @keyframes dairyBootDrop {
          0% {
            transform: translateY(-8px);
            opacity: 0;
          }
          30% {
            opacity: 0.9;
          }
          100% {
            transform: translateY(24px);
            opacity: 0;
          }
        }

        @keyframes dairyBootPulse {
          0%,
          100% {
            opacity: 1;
          }
          50% {
            opacity: 0.55;
          }
        }

        /*
         * Honour the OS setting. The pot is left filled and the stream solid, so
         * the still frame still reads as "milk poured into a pan" rather than an
         * empty glass.
         */
        @media (prefers-reduced-motion: reduce) {
          .dairy-boot__stream,
          .dairy-boot__milk,
          .dairy-boot__drop,
          .dairy-boot__label {
            animation: none;
          }

          .dairy-boot__stream {
            stroke-dasharray: none;
          }

          .dairy-boot__milk {
            transform: translateY(12px);
          }
        }
      </style>

      <div class="dairy-boot" role="status">
        <!--
          Decorative: every part of it is described by the caption below, so it
          is hidden from assistive technology rather than read out shape by
          shape.
        -->
        <svg class="dairy-boot__art" viewBox="0 0 176 176" aria-hidden="true" focusable="false">
          <defs>
            <linearGradient id="dairyBootTile" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#3b82f6"/>
              <stop offset="100%" stop-color="#4f46e5"/>
            </linearGradient>

            <!--
              The pan's interior. The milk is clipped to this, which is what
              keeps the level inside the vessel at any animation frame.
            -->
            <clipPath id="dairyBootPan">
              <path d="M50 104 H126 L119 142 A12 12 0 0 1 107 152 H69 A12 12 0 0 1 57 142 Z"/>
            </clipPath>
          </defs>

          <!-- The home-screen tile, so the icon appears to come alive. -->
          <rect x="0" y="0" width="176" height="176" rx="40" fill="url(#dairyBootTile)"/>

          <!-- The pour, drawn first so it passes behind the bottle's mouth. -->
          <path class="dairy-boot__stream" d="M84 58 C 85 78, 88 92, 90 106" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>

          <!--
            The bottle, lifted from the icon set and tipped 118 degrees so its
            neck points down into the pan.
          -->
          <g transform="translate(35.3 18.3) scale(0.92) rotate(118 32 32)">
            <path d="M27 11h10a2 2 0 0 1 0 4h-1v4.2c0 .9.3 1.8.9 2.5l2.4 2.9c.9 1 1.4 2.3 1.4 3.7V48a5 5 0 0 1-5 5H28.3a5 5 0 0 1-5-5V28.3c0-1.4.5-2.7 1.4-3.7l2.4-2.9c.6-.7.9-1.6.9-2.5V15h-1a2 2 0 0 1 0-4z" fill="#ffffff"/>
            <rect x="25.5" y="6" width="13" height="4.6" rx="1.8" fill="#dbeafe"/>
          </g>

          <!-- An empty pan reads as glass: a faint fill, outlined later. -->
          <path d="M50 104 H126 L119 142 A12 12 0 0 1 107 152 H69 A12 12 0 0 1 57 142 Z" fill="#ffffff" opacity="0.14"/>

          <!-- The milk level, clipped to the pan. -->
          <g clip-path="url(#dairyBootPan)">
            <g class="dairy-boot__milk">
              <rect x="42" y="104" width="92" height="60" fill="#ffffff"/>
              <ellipse cx="88" cy="104" rx="42" ry="5" fill="#bfdbfe"/>
            </g>
          </g>

          <!-- The pan itself: rim, body and two handles. -->
          <path d="M50 104 H126 L119 142 A12 12 0 0 1 107 152 H69 A12 12 0 0 1 57 142 Z" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
          <path d="M52 116 h-9 a7 7 0 0 0 0 14 h9" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M124 116 h9 a7 7 0 0 1 0 14 h-9" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

          <!-- Droplets, for movement while the level is settling. -->
          <circle class="dairy-boot__drop dairy-boot__drop--a" cx="78" cy="72" r="2.6" fill="#dbeafe"/>
          <circle class="dairy-boot__drop dairy-boot__drop--b" cx="95" cy="80" r="2.2" fill="#dbeafe"/>
        </svg>

        <p class="dairy-boot__label">Loading <strong>Dairy Hub</strong>…</p>
      </div>
    </app-root>
  <script>(() => {
  const scripts = [['main-MQUF6YSV.js', "module", false, false, null, null]];
  scripts.forEach(function(scriptUrl) {
    const s = document.createElement('script');
    s.src = scriptUrl[0];
    s.type = scriptUrl[1];
    s.async = scriptUrl[2];
    s.defer = scriptUrl[3];
    if (scriptUrl[4]) {
      s.integrity = scriptUrl[4];
    }
    if (scriptUrl[5]) {
      s.crossOrigin = scriptUrl[5];
    }
    document.lastElementChild.appendChild(s);
  });
})();
</script><script nonce="CSP_NONCE_PLACEHOLDER">document.querySelectorAll('link[data-beasties-media]').forEach(function(l){l.media=l.getAttribute('data-beasties-media');l.removeAttribute('data-beasties-media')})</script></body>
